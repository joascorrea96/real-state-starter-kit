<div class="favorites-page">
  <div class="page-header">
    <h1>Favoritos para Venda e Locação</h1>
    <p>{{ validProperties().length }} imóvel favorito</p>
  </div>

  @if (validProperties().length > 0) {
    <div class="property-grid">
      @for (property of validProperties(); track property.id) {
        <app-property-card [property]="property" />
      }
    </div>
  } @else {
    <div class="empty-state">
      <p>Você ainda não favoritou nenhum imóvel.</p>
    </div>
  }
</div>
