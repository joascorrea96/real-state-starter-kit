<div class="search-filter-bar">
  <div class="search-input">
    <span class="icon">⌕</span>
    <input
      type="text"
      [value]="initialSearch"
      [placeholder]="placeholder"
      (input)="onInput($any($event.target).value)"
    />
  </div>

  <div class="extra-filters">
    <ng-content></ng-content>
  </div>
</div>
